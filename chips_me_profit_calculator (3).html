<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChipsMe Profit Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #fff8f0;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .calculator {
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #f57c00;
    }
    label, select, input {
      display: block;
      margin: 15px auto;
      width: 100%;
      max-width: 300px;
    }
    button {
      background: #f57c00;
      color: #fff;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
      color: #388e3c;
    }
    .note {
      margin-top: 30px;
      font-size: 0.95em;
      background-color: #fff3e0;
      padding: 15px;
      border-left: 5px solid #f57c00;
      text-align: left;
    }

    /* Loading overlay shown while the "calculation" is processing */
    .loading-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 20px auto;
    }
    .loading-overlay.active {
      display: flex;
    }
    /* Spinning chip built from CSS only, so it never depends on an image asset that could go missing */
    .chip-spinner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background:
        repeating-conic-gradient(#f57c00 0deg 30deg, #ffcc80 30deg 60deg);
      position: relative;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 0 4px #fff8f0, 0 0 0 6px #f57c00;
    }
    .chip-spinner::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff8f0;
      transform: translate(-50%, -50%);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #f57c00;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="calculator">
      <h1>ChipsMe Profit Calculator</h1>

      <!-- Role selection dropdown -->
      <label for="role">Choose your role:</label>
      <select id="role" onchange="updateInputLabel()">
        <option value="seller">ChipsMe Seller</option>
        <option value="partner">ChipsMe Sleeping Partner</option>
      </select>

      <!-- Input label that changes dynamically based on role -->
      <label id="input-label" for="input">Number of packages sold:</label>
      <input type="number" id="input" min="0" />

      <!-- Calculate button -->
      <button id="calc-btn" onclick="calculateProfit()">Calculate Profit</button>

      <!-- Loading animation shown while the result is being computed -->
      <div class="loading-overlay" id="loading-overlay">
        <div class="chip-spinner"></div>
        <div class="loading-text">Calculating...</div>
      </div>

      <!-- Area to display result -->
      <div class="result" id="result"></div>

      <!-- Informational note about minimum profits -->
      <div class="note">
        📌 <strong>Minimum Rough Profit:</strong><br>
        - ChipsMe Seller: 6,000 FCFA per week<br>
        - ChipsMe Sleeping Partner: 3,000 FCFA per week
      </div>
    </div>
  </div>

  <script>
    // Function to update input label text depending on selected role
    function updateInputLabel() {
      const role = document.getElementById("role").value;
      const label = document.getElementById("input-label");
      // Change label based on whether user is seller or partner
      label.textContent = role === "seller" ? "Number of packages sold:" : "Number of customers referred:";
    }

    // Function to calculate profit based on user input and role
    function calculateProfit() {
      const role = document.getElementById("role").value;
      const input = parseInt(document.getElementById("input").value);
      const resultEl = document.getElementById("result");
      const overlay = document.getElementById("loading-overlay");
      const button = document.getElementById("calc-btn");

      // Handle invalid input
      if (isNaN(input) || input < 0) {
        resultEl.textContent = "Please enter a valid number.";
        return;
      }

      // Show the loading animation and hide any previous result while "processing"
      resultEl.textContent = "";
      overlay.classList.add("active");
      button.disabled = true;

      setTimeout(() => {
        let result = 0;

        // Logic for seller role: each package sold = 500 FCFA
        if (role === "seller") {
          result = input * 500;
          resultEl.textContent = `As a ChipsMe Seller, you earn ${result.toLocaleString()} FCFA.`;
        }
        // Logic for partner role: each customer referred = 250 FCFA
        else if (role === "partner") {
          result = input * 250;
          resultEl.textContent = `As a Sleeping Partner, you earn ${result.toLocaleString()} FCFA.`;
        }

        // Hide the loading animation once the result is ready
        overlay.classList.remove("active");
        button.disabled = false;
      }, 900);
    }
  </script>
</body>
</html>
